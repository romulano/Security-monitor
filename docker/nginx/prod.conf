# nginx do stack em produção (imagem secmon/web:prod). Só o nginx da borda
# (site-nginx-1) chega aqui, pela rede `web`; ele termina o TLS, confia apenas
# nos IPs da Cloudflare e manda o IP real do visitante em X-Real-IP e
# X-Forwarded-For. O Laravel lê o X-Forwarded-For (trustProxies).
#
# A imagem só tem o nginx e esta configuração: o public/ (CSS/JS do build,
# imagens) vem do volume que o app preenche no boot. Assim o nginx não precisa
# ser trocado a cada deploy, e a borda nunca fica sem ninguém para responder.
log_format secmon '$http_x_real_ip - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Robô da busca (29/10/2026): ~20 mil buscas por hora em /?q= com 3 ou 4 facetas,
# cada uma de um IP diferente (proxy residencial), ocuparam os 12 PHP e o site
# parou de responder. Todas mandam o Referer "https://example.com" sem a barra
# final, que navegador nenhum manda: com a Referrer-Policy do site, ele envia o
# endereço inteiro ou a origem com a barra.
map $http_referer $referer_sem_barra {
    "https://example.com" 1;
    default             0;
}
map "$referer_sem_barra:$arg_q" $robo_da_busca {
    "~^1:."  1;
    default  0;
}

# Buscas ao mesmo tempo (prod-site.conf), em duas vagas. Com uma vaga só para
# todo mundo, o robô da busca de 01/11/2026 (184 mil IPs residenciais, 1 a 4
# acessos cada, sem JavaScript, direto no /?q=) ocupava as 6 buscas, e quem
# navegava levava 429. Agora:
#   - quem navega no site tem vagas próprias: tem o cookie que o Laravel manda
#     na primeira página (criptografado, começa com eyJpdiI6) e veio de uma
#     página do site (o Referer de mesma origem traz o endereço inteiro). Um
#     teto por IP real (o X-Real-IP que a borda manda) impede que um só ocupe
#     todas;
#   - o resto (o robô, o link de fora que cai direto numa busca, a API) divide
#     uma vaga pequena: cheia, o excesso leva 429 sem chegar ao PHP.
# Sem ?q= nenhuma chave é preenchida e o nginx não conta. Quem forjar o cookie e
# o Referer cai no teto por IP; contra robô assim, a defesa é a da Cloudflare.
map $http_cookie $tem_sessao {
    "~eyJpdiI6"  1;
    default      0;
}
map $http_referer $veio_do_site {
    "~^https://example\.com/"  1;
    default                  0;
}
map $http_x_real_ip $ip_real {
    ""       $remote_addr;
    default  $http_x_real_ip;
}
map "$tem_sessao$veio_do_site:$arg_q" $busca_do_site {
    "~^11:."  busca;
    default   "";
}
map "$tem_sessao$veio_do_site:$arg_q" $busca_do_site_ip {
    "~^11:."  $ip_real;
    default   "";
}
map "$tem_sessao$veio_do_site:$arg_q" $busca_de_fora {
    "~^11:"   "";
    "~^..:."  busca;
    default   "";
}
limit_conn_zone $busca_do_site zone=busca_do_site:1m;
limit_conn_zone $busca_do_site_ip zone=busca_por_ip:1m;
limit_conn_zone $busca_de_fora zone=busca_de_fora:1m;

# Para qual PHP vai cada servidor abaixo ($secmon_app e $secmon_app_novo). O
# deploy (ci/servidor/trocar.sh) reescreve o arquivo e recarrega o nginx.
include /etc/nginx/secmon/upstream.conf;

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log secmon;

    set $php $secmon_app;
    include /etc/nginx/secmon/site.conf;
}

# Porta de teste do deploy: o site inteiro, mas com o app novo. Só existe
# dentro do container (127.0.0.1); o deploy confere por aqui que o app novo
# responde antes de passar o site para ele.
server {
    listen 127.0.0.1:8080;
    server_name _;
    access_log off;

    set $php $secmon_app_novo;
    include /etc/nginx/secmon/site.conf;
}
