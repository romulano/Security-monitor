# Para qual PHP o nginx manda as requisições. Fora do deploy, os dois apontam
# para o alias `secmon-fpm`, que o Docker resolve para o app no ar. Durante o
# deploy, o ci/servidor/trocar.sh reescreve este arquivo dentro do container:
# primeiro só o teste vai para o app novo, depois o site.
map $host $secmon_app      { default secmon-fpm:9000; }
map $host $secmon_app_novo { default secmon-fpm:9000; }
