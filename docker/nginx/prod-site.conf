# O site, igual nos dois servidores do prod.conf; só muda o PHP ($php).
root /var/www/html/public;
index index.php;

charset utf-8;
server_tokens off;
client_max_body_size 8M;

# Resolve o PHP a cada requisição: o app é achado pelo nome (o alias
# `secmon-fpm` ou o container do app novo, no deploy), nunca por um IP fixo.
resolver 127.0.0.11 valid=10s ipv6=off;

# O robô da busca (prod.conf) recebe 403 sem chegar ao PHP.
if ($robo_da_busca) {
    return 403;
}

# As vagas da busca (prod.conf): 6 para quem navega no site (3 por IP) e 2 para
# o resto. Somadas, no máximo 8 dos 12 PHP (docker/php/fpm-pool.conf) ficam com
# busca, e o login, as matérias e o resto do site sempre têm PHP. O excesso
# leva 429 numa página estática, sem PHP, que tenta de novo sozinha.
limit_conn busca_do_site 6;
limit_conn busca_por_ip 3;
limit_conn busca_de_fora 2;
limit_conn_status 429;
limit_conn_log_level warn;
error_page 429 /busca-cheia.html;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Só o front controller executa PHP; qualquer outro .php é 404. O index.php
# também vai para o volume do public/ (o `index` do `/` procura o arquivo),
# mas quem o executa é o PHP, com a cópia dele.
location = /index.php {
    fastcgi_pass $php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_read_timeout 300;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

# Envio de prints de uma matéria no admin (até 10 imagens de 5 MB): o
# único endereço com limite maior. Vai direto ao front controller, porque
# o limite vale na location que lê o corpo, e o try_files mudaria de location.
location ~ ^/admin/artigos/[0-9]+/texto$ {
    client_max_body_size 64M;
    fastcgi_pass $php;
    include fastcgi_params;
    # Depois do include: o PHP-FPM fica com o último valor, e o Laravel
    # calcula a URL base a partir de SCRIPT_NAME.
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_read_timeout 300;
}

location ~ \.php$ {
    return 404;
}

# A página do 429 da busca (só o error_page acima chega aqui). Os cabeçalhos do
# servidor não valem numa location com add_header: vão de novo.
location = /busca-cheia.html {
    internal;
    add_header Retry-After 5 always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}

location ~ /\.(?!well-known).* {
    deny all;
}

location ~* \.(css|js|woff2?|png|jpe?g|svg|webp|ico)$ {
    expires 30d;
    access_log off;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
