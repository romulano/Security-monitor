server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Resolve o upstream a cada requisição pelo DNS interno do compose: sem
        # isto o nginx fixa o IP do app no boot e passa a dar 502 toda vez que o
        # container do app é recriado.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|woff2?|png|jpe?g|svg|webp|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
