[www]
; O container roda com o UID do host (compose: `user:`), então o php-fpm não
; troca de usuário — quem escreve em storage/ é o dono real dos arquivos.
listen = 9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
