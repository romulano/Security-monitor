memory_limit = 512M
max_execution_time = 300
; Prints da matéria no admin: até 10 imagens de 5 MB numa requisição.
upload_max_filesize = 8M
post_max_size = 64M
date.timezone = America/Sao_Paulo

; Não anuncia a versão do PHP em X-Powered-By (era PHP/8.4.27 em produção).
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; O crawler baixa HTML de terceiros; mantenha os limites de rede curtos.
default_socket_timeout = 30
