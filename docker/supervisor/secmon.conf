; Processos de fundo do Security Monitor em produção: filas e agendador num container só
; (serviço `supervisor` do docker-compose.prod.yml). O supervisord roda com o
; usuário do container, sem root, e tudo sai no stdout: `docker logs secmon-supervisor`.
;
;   docker exec secmon-supervisor supervisorctl -c /etc/supervisor/secmon.conf status

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Alertas (matching) e Slack não podem esperar a fila de análise esvaziar:
; worker próprio, que não pega jobs longos.
[program:fila-alertas]
command=php /var/www/html/artisan queue:work --queue=alerts,notifications,notifications-low --sleep=3 --tries=3 --timeout=120 --max-time=3600
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=130
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Análise por IA (hermes, até 300 s por artigo), descoberta de domínio e o
; "rodar todos" do admin (RunCrawler, na default). Dois processos = as duas
; chamadas paralelas que o hermes aceita (HERMES_PARALELAS). A `judge` (parecer
; da IA antes de enviar um alerta) vem primeiro: o alerta espera no máximo a
; análise em andamento terminar, não a fila inteira. A `merge` (fusão noturna
; das matérias parecidas) só anda quando a análise das notícias está em dia. A
; `github` (varredura diária do monitoramento do GitHub, que espera o limite da
; API, até 15 min) vem antes da merge.
; A `pentest-ai` (a IA que põe em ordem as hipóteses de um teste de segurança,
; no máximo 4 chamadas curtas por execução) vem logo depois da `judge`: o teste
; não espera a fila das notícias, e sem vaga em 20 min segue sem a IA.
[program:fila-analise]
command=php /var/www/html/artisan queue:work --queue=judge,pentest-ai,enrich,discovery,github,merge,subdomains,default --sleep=3 --tries=2 --timeout=300 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=310
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Radar de domínios: a varredura completa vira ~130 lotes de DNS (uns 100 nomes e 15 s cada,
; CheckLookalikeNames), a busca em certificados e o job que junta tudo (FinishLookalikeScan).
; Worker próprio, fora da análise: o parecer da IA não espera varredura e a varredura não espera
; coleta. Quatro processos = uns 27 nomes/s no DNS (13 mil nomes em ~8 min por Radar); o DNS é
; I/O puro, cada processo ocioso custa ~45 MB. Cada lote tem o seu retry (tries/backoff no job).
[program:fila-radar]
command=php /var/www/html/artisan queue:work --queue=lookalikes --sleep=3 --tries=3 --timeout=600 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=4
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=310
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Varredura de chaves dos domínios comprovados (ScanSiteKeys): uns minutos de navegação devagar por
; domínio, semanal ou pelo "Varrer agora". Um processo basta e fica fora do Radar e da análise.
[program:fila-chaves]
command=php /var/www/html/artisan queue:work --queue=keys --sleep=5 --tries=1 --timeout=600 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Monitoria de segurança dos sites do admin: cada varredura faz umas 20 requisições com até 8 s
; de espera, então pode levar minutos. Worker próprio: rede lenta de um site não atrasa alerta
; nem análise (e o contrário também). Um processo basta: uns 20 sites a cada 6 horas.
[program:fila-seguranca]
command=php /var/www/html/artisan queue:work --queue=security --sleep=5 --tries=1 --timeout=180 --max-time=3600
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=190
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; A carga dos dumps de vazamento: um arquivo de gigabytes leva dezenas de minutos, então tem fila
; própria para não segurar a análise atrás dele. numprocs=1: dois workers lendo dumps ao mesmo tempo
; brigariam por banco e disco sem ganhar nada. stopwaitsecs baixo de propósito — deploy não espera meia
; hora; o job morto é retentado e recomeça o arquivo, o que é seguro porque a carga é idempotente.
[program:fila-vazamentos]
command=php /var/www/html/artisan queue:work --queue=vazamentos --sleep=5 --tries=3 --timeout=5400 --max-time=3600
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Testes de segurança: os passos das execuções (AdvancePentestRun), um processo, porque é um
; teste por vez no servidor. Fila própria: `supervisorctl stop fila-pentest` para os passos sem
; tocar no resto. Cada passo tem até 120 s (timeout 150, uma tentativa: quem repete é o vigia,
; secmon:pentest-tick, com o CAS da tentativa); o stopwaitsecs fica acima disso e abaixo dos 320 s
; que o compose espera. Sem execução (PENTEST_ALLOWED=false), ele só dorme: ~45 MB.
[program:fila-pentest]
command=php /var/www/html/artisan queue:work --queue=pentest --sleep=3 --tries=1 --timeout=150 --max-time=3600
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=160
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Bot do Telegram: recebe o /start de quem conecta (long polling, sem webhook
; público). Sem TELEGRAM_BOT_TOKEN ele só dorme. Cada busca espera até 50 s.
[program:telegram]
command=php /var/www/html/artisan secmon:telegram-updates --max-time=3600
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=65
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Agendador: crawler de hora em hora, reprocessamento, resumos e descoberta.
[program:agendador]
command=php /var/www/html/artisan schedule:work
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
